<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaMath - honest aquarium math</title>
<style>
  :root { --bg:#0f1518; --card:#16222a; --line:#27404e; --ink:#e2ecf0; --dim:#8fa8b3; --aqua:#4fc3d9; --warn:#e0894a; --ok:#7fc36a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:920px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:30px; margin:6px 0 0; } h1 span { color:var(--aqua); }
  nav { text-align:right; } nav a { color:var(--dim); text-decoration:none; font-size:14px; }
  nav a:hover { color:var(--aqua); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-top:22px; }
  .card h2 { margin:0 0 14px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  input, select { background:#0e181d; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 10px; font-size:15px; width:100px; }
  select { width:auto; min-width:150px; }
  .presets { margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; }
  .presets button { background:#1b2c35; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .presets button:hover { border-color:var(--aqua); }
  .stat { display:inline-block; background:#0e181d; border:1px solid var(--line); border-radius:10px; padding:12px 18px; margin:0 10px 10px 0; min-width:130px; }
  .stat b { display:block; font-size:24px; color:var(--aqua); }
  .stat small { color:var(--dim); font-size:12px; }
  .verdict { font-size:17px; margin:2px 0 14px; }
  .verdict b { color:var(--aqua); }
  .fix { background:#152630; border:1px solid #2b4a5c; border-radius:10px; padding:12px 16px; margin-top:8px; font-size:15px; }
  .fix.ok { background:#152a1c; border-color:#2b5234; }
  .fix.warn { background:#2c1e12; border-color:#5c3d20; }
  .note { color:var(--dim); font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="index.html">about</a></nav>
  <h1>Aqua<span>Math</span></h1>
  <div class="note" style="font-size:14px;">The box lies about volume, the pet store lies about fish size, and the heater aisle lies about watts. Arithmetic fixes all three.</div>

  <div class="card">
    <h2>The tank</h2>
    <div class="row">
      <div><label>Length (in)</label><input id="len" type="number" min="6" step="1" value="24"></div>
      <div><label>Width (in)</label><input id="wid" type="number" min="6" step="1" value="12"></div>
      <div><label>Height (in)</label><input id="hgt" type="number" min="6" step="1" value="16"></div>
      <div><label>Room is cooler by (F)</label><input id="delta" type="number" min="0" max="25" step="1" value="8"></div>
      <div><label>Substrate depth (in)</label><input id="depth" type="number" min="0" max="6" step="0.5" value="2"></div>
    </div>
    <div class="presets" id="presets"></div>
  </div>

  <div class="card">
    <h2>The equipment</h2>
    <div id="equip"></div>
  </div>

  <div class="card">
    <h2>The stocking</h2>
    <div class="row">
      <div><label>Fish type</label><select id="body"><option value="slim" selected>Slim community (tetras, rasboras)</option><option value="tall">Tall-bodied (angels, discus)</option><option value="goldfish">Fancy goldfish</option></select></div>
      <div><label>Total ADULT inches planned</label><input id="inches" type="number" min="0" step="1" value="14"></div>
    </div>
    <div id="stock"></div>
  </div>

  <div class="card">
    <h2>The water changes</h2>
    <div class="row">
      <div><label>Change (%)</label><input id="pct" type="number" min="5" max="60" step="5" value="25"></div>
    </div>
    <div id="water"></div>
  </div>
</div>
<script src="engine.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };
var PRESETS = {
  '10 gal betta': { len:20, wid:10, hgt:12, delta:6, depth:2, body:'slim', inches:3, pct:25 },
  '20 gal community': { len:24, wid:12, hgt:16, delta:8, depth:2, body:'slim', inches:14, pct:25 },
  '29 gal planted': { len:30, wid:12, hgt:18, delta:10, depth:3, body:'slim', inches:20, pct:30 },
  '55 gal goldfish': { len:48, wid:13, hgt:21, delta:12, depth:3, body:'goldfish', inches:0, pct:40 }
};
var pb = $('presets');
Object.keys(PRESETS).forEach(function(name){
  var b = document.createElement('button'); b.textContent = name;
  b.onclick = function(){ var p = PRESETS[name];
    ['len','wid','hgt','delta','depth','body','inches','pct'].forEach(function(k){ $(k).value = p[k]; }); render(); };
  pb.appendChild(b);
});
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function render(){
  var L=parseFloat($('len').value), W=parseFloat($('wid').value), H=parseFloat($('hgt').value);
  var delta=parseFloat($('delta').value)||0, depth=parseFloat($('depth').value)||0;
  if (!(L>0&&W>0&&H>0)) { $('equip').innerHTML='<div class="note">Enter tank dimensions.</div>'; $('stock').innerHTML=''; $('water').innerHTML=''; return; }
  var nom=AquaEngine.tankVolumeGal(L,W,H);
  var real=AquaEngine.realVolumeGal(nom);
  var heater=AquaEngine.heaterWatts(real, delta);
  var filt=AquaEngine.filterGPH(real);
  var sub=AquaEngine.substrateLbs(L,W,depth);

  $('equip').innerHTML =
    '<div class="verdict">That glass box is <b>' + nom + ' gal</b> on paper - really <b>' + real + ' gal</b> once substrate and hardscape move in.</div>' +
    '<span class="stat"><b>' + heater + 'W</b><small>heater (room ' + delta + 'F cooler)</small></span>' +
    '<span class="stat"><b>' + filt.min + '-' + filt.target + '</b><small>filter GPH (4-5x turnover)</small></span>' +
    '<span class="stat"><b>' + sub + ' lb</b><small>substrate at ' + depth + 'in deep</small></span>' +
    '<div class="note">Heater: ' + (delta>10?'5W per gallon - big room-to-tank gap':'3W per gallon - mild gap') + ', rounded up to a real size. Messy fish (goldfish, cichlids) want ' + filt.messy + ' GPH, not ' + filt.target + '. Two smaller heaters beat one big one - when one fails, the other notices.</div>';

  var body=$('body').value, inches=parseFloat($('inches').value)||0;
  var sv=AquaEngine.stockingVerdict(inches, real, body);
  var over=/overstocked/.test(sv), small=/too small/.test(sv);
  var extra='';
  if (body==='goldfish') {
    extra='<div class="note">Goldfish are 8-inch manure engines. The inch-per-gallon rule never applied to them: 20 gal for the first fancy, +10 for each extra, and commons need ponds.</div>';
  } else {
    var cap=AquaEngine.maxInches(real, body);
    extra='<div class="note">Inch-per-gallon, used honestly: ' + (body==='tall'?'tall-bodied fish get half the inches':'slim fish only') + ', ADULT size not pet-store size, against the real ' + real + ' gal. Your cap is ~' + cap + ' inches. That 2-inch oscar becomes a 12-inch problem.</div>';
  }
  $('stock').innerHTML =
    '<div class="fix' + (over||small?' warn':' ok') + '">' + esc(sv) + '</div>' + extra;

  var pct=parseFloat($('pct').value)||25;
  var wc=AquaEngine.waterChangeGal(real, pct);
  var cond=AquaEngine.conditionerMl(wc);
  var cyc=AquaEngine.cycleWeeks();
  $('water').innerHTML =
    '<div class="verdict">' + pct + '% of the real volume is <b>' + wc + ' gal</b> out, ' + wc + ' gal in - with <b>' + cond + ' ml</b> of conditioner on the new water.</div>' +
    '<span class="stat"><b>' + wc + ' gal</b><small>to change (' + pct + '%)</small></span>' +
    '<span class="stat"><b>' + cond + ' ml</b><small>conditioner, generic dose</small></span>' +
    '<div class="note">Check your conditioner label - doses vary wildly (some are 5 ml per 50 gal, some 1 ml per 10). New tank? The fishless cycle takes ' + cyc.min + '-' + cyc.max + ' weeks. "Adding fish to feed the cycle" is just hurting fish slowly.</div>';
}
['len','wid','hgt','delta','depth','body','inches','pct'].forEach(function(id){ $(id).addEventListener('input', render); });
render();
</script>
</body>
</html>
